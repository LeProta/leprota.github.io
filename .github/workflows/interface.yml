name: Vérifier l’interface et le serveur de session
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: Vérifier le lecteur et la navigation sans réseau ni clé
        run: npm test
      - name: Installer les bibliothèques officielles du serveur
        run: npm ci --ignore-scripts --prefix session-server
      - name: Vérifier les sessions avec Google et le stockage simulés
        run: npm test --prefix session-server
      - name: Construire le conteneur sans le déployer
        run: docker build -f Dockerfile.session -t journal-session:verification .
